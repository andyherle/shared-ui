<!doctype html><html lang="en" data-ui="personal" data-theme="dark"><meta charset="utf-8">
<title>Native composition policy checks</title><link rel="stylesheet" href="/v1/styles.css">
<script src="/v1/runtime.js"></script>
<body><output id="result">Running composition policy checks…</output><main class="ui-stack ui-pad" id="fixture"></main>
<script type="module">
import {createRenderer} from '/renderer.mjs';
const assert=(value,message)=>{if(!value)throw Error(message);};
const UI=window.SharedUI,fixture=document.querySelector('#fixture');
UI.instance?.dispose();
const make=(tag,text)=>{const el=document.createElement(tag);if(text)el.textContent=text;return el;};
const results=[];
try {
 for(const pack of ['personal','postvisual'])for(const theme of ['dark','light']){
  document.documentElement.dataset.ui=pack;document.documentElement.dataset.theme=theme;
  const scope=UI.createCompositionScope();
  const form=make('form');form.id='policy-form';form.className='ui-stack';fixture.append(form);
  const input=make('input');input.name='name';input.required=true;input.setAttribute('aria-label','Synthetic name');
  const textarea=make('textarea');textarea.name='notes';textarea.setAttribute('aria-label','Synthetic notes');textarea.value='Original note';
  const a=UI.createComposition('control-group',{header:make('h3','First view'),body:[input,textarea]},{scope,instanceId:'first-view'});
  const b=UI.createComposition('control-group',{header:make('h3','Second view'),body:make('input')},{scope,instanceId:'second-view'});
  form.append(a.element,b.element);let submits=0;form.addEventListener('submit',event=>{event.preventDefault();submits++;});
  input.value='Unsaved field';input.focus();input.setSelectionRange(2,7);
  const nodes=[...form.querySelectorAll('*')];
  let mutationRecords=[];const observer=new MutationObserver(records=>mutationRecords.push(...records));
  observer.observe(form,{childList:true,subtree:true});
  const before=scope.preview({'control-group':{variant:'grid'}},{expectedRevision:0});assert(before.changed===2,'Both views in impact preview');
  scope.setDefaults({'control-group':{variant:'grid'}},{expectedRevision:0});await Promise.resolve();
  assert(a.slots.body.classList.contains('ui-grid')&&b.slots.body.classList.contains('ui-grid'),'One setting reaches both views');
  assert(mutationRecords.length===0,'No DOM replacement or reparenting on layout change');
  assert(nodes.every((el,i)=>el===form.querySelectorAll('*')[i]),'Every original node retained');
  assert(document.activeElement===input&&input.value==='Unsaved field'&&input.selectionStart===2&&input.selectionEnd===7,'Focus, value and selection retained');
  b.setLayout({variant:'stack'});scope.setDefaults({'control-group':{variant:'stack'}},{expectedRevision:1});
  scope.setDefaults({'control-group':{variant:'grid'}},{expectedRevision:2});
  assert(a.getConfiguration().variant==='grid'&&b.getConfiguration().variant==='stack','Local pin remains');
  b.setLayout({variant:null});assert(b.getConfiguration().variant==='grid','Reset resumes inheritance');
  assert(a.slots.header.tagName==='SUMMARY'&&!a.slots.header.classList.contains('ui-action'),'Heading disclosure, not a boxed action');
  a.slots.header.click();assert(!a.element.open,'Native heading closes');
  scope.setDefaults({},{expectedRevision:3});assert(!a.element.open,'Closed state retained');
  a.slots.header.click();form.requestSubmit();assert(submits===1,'Exactly one native submit');
  assert(input.form===form&&new FormData(form).get('name')==='Unsaved field','Form owner and submitted value unchanged');
  const version=scope.getState().revision;try{scope.setDefaults({'control-group':{variant:'script'}},{expectedRevision:version});throw Error('invalid accepted');}catch(error){assert(error.message!=='invalid accepted','Reject invalid candidate');}
  assert(scope.getState().revision===version&&a.getConfiguration().variant==='stack','Failed edit is unchanged');
  observer.disconnect();a.dispose();b.dispose();scope.dispose();form.remove();results.push({pack,theme,scope:'factory'});
 }
 fixture.innerHTML='<form id="ssr-form"><details class="ui-section ui-composition" data-ui-composition="control-group" data-ui-composition-revision="1" data-ui-composition-instance="server" data-ui-variant="grid" open><summary data-ui-composition-slot="header"><h3>Server section</h3></summary><div class="ui-grid" data-ui-composition-slot="body"><input name="text" aria-label="Server value"></div></details></form>';
 const server=fixture.querySelector('details'),field=fixture.querySelector('input'),originalParent=server.parentNode;field.value='Server draft';field.focus();field.setSelectionRange(1,6);
 const scope=UI.createCompositionScope(),handle=UI.adoptComposition(server,{scope,variant:null});
 scope.setDefaults({'control-group':{variant:'grid'}},{expectedRevision:0});
 assert(field===fixture.querySelector('input')&&document.activeElement===field&&field.selectionStart===1,'Adoption keeps connected native editing state');
 handle.dispose();scope.dispose();assert(server.parentNode===originalParent,'Dispose never removes adopted app root');fixture.replaceChildren();
 const renderer=createRenderer(fixture),node=(id,componentId,props={},slots={})=>({id,componentId,props,slots,tokens:{},bindings:{}});
 const model={pack:'personal',mode:'dark',density:'compact',tokens:{},root:'group',nodes:{
 group:node('group','control-group',{}, {header:['heading'],body:['field']}),
 heading:node('heading','text',{label:'Editable group',role:'heading'}),
 field:node('field','text-input',{label:'Editable field'})}};
 renderer.render(model,{documentId:'policy-document'});const original=fixture.querySelector('input');original.value='Studio draft';original.focus();original.setSelectionRange(3,8);
 const group=fixture.querySelector('details');group.open=false;
 model.compositionDefaults={'control-group':{variant:'grid'}};renderer.render(model,{documentId:'policy-document'});
 assert(original===fixture.querySelector('input')&&original.value==='Studio draft'&&document.activeElement===original,'Studio layout edit keeps input identity and focus');
 assert(!group.open&&original.selectionStart===3,'Studio layout edit keeps native collapse and selection');
 assert(group.querySelector('[data-ui-composition-slot=body]').classList.contains('ui-grid'),'Studio uses the same shared policy');
 renderer.dispose();assert(!fixture.children.length,'Studio cleanup');
 window.compositionChecks=results;document.querySelector('#result').textContent='PASS: linked layouts, override/reset, native heading, connected adoption, exact form ownership, Studio renderer, focus/selection and no DOM moves.';
 document.documentElement.dataset.testResult='pass';
}catch(error){document.querySelector('#result').textContent=error.stack;document.documentElement.dataset.testResult='fail';}
</script></body></html>
