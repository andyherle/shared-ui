<!doctype html><html data-ui="postvisual"><meta charset="utf-8"><title>Compact native contracts</title><link rel="stylesheet" href="/v1/styles.css"><script src="/v1/runtime.js"></script><button id="run">Run compact native checks</button><pre id="result">Ready</pre><div id="fixtures"></div><script>
const assert=(v,m)=>{if(!v)throw Error(m)},frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#result'),fixtures=document.querySelector('#fixtures');output.textContent='RUNNING';try{let lines=[];for(const pack of ['postvisual','personal'])for(const width of [390,1440]){const s=document.createElement('section');s.dataset.ui=pack;s.style.width=width+'px';s.style.position='relative';s.style.height='300px';s.innerHTML='<div class="ui-review-dock"><div data-root><div data-rating><button data-ui-icon="star" aria-label="Rate">Rate</button></div><div data-actions><button data-ui-icon="check">Select</button><button data-ui-icon="grid">Add to board</button></div><div data-tags><form class="ui-field"><input name="tag" aria-label="Tag" value="draft"></form><div data-chips></div></div><nav class="ui-actions ui-fill"><button data-ui-icon="arrow-left">Previous</button><button data-ui-icon="info">Info</button><button data-ui-icon="arrow-right">Next</button></nav></div></div>';fixtures.append(s);const root=s.querySelector('[data-root]'),tags=s.querySelector('[data-tags]'),chips=s.querySelector('[data-chips]'),input=s.querySelector('input'),original=[...root.children],review=SharedUI.createReviewControls(root,{rating:s.querySelector('[data-rating]'),actions:s.querySelector('[data-actions]'),tags,navigation:s.querySelector('nav'),layout:'rows',sprite:'/v1/icons.svg'}),tag=SharedUI.createTagInput(input,{field:tags,chips,layout:'field'});for(let i=0;i<12;i++){const chip=document.createElement('button');chip.className='ui-tag';chip.textContent='Selected tag '+i;chips.append(chip)}await frame();assert(Math.abs(root.getBoundingClientRect().width-(width===1440?Math.min((width-24)*.7,64*parseFloat(getComputedStyle(document.documentElement).fontSize)):width-24))<2,'Review width is not 70% wide/full narrow');assert(root.firstElementChild===tags,'Tags are not first');assert(tags.getBoundingClientRect().bottom<=root.lastElementChild.getBoundingClientRect().top+1,'Tags overlap commands');assert(root.scrollWidth<=root.clientWidth+1,'Review overflows');for(const button of root.querySelectorAll('nav button')){const b=button.getBoundingClientRect(),l=button.querySelector('.ui-label').getBoundingClientRect();assert(l.left>=b.left&&l.right<=b.right,'Navigation label escapes its button');}assert(input.value==='draft'&&input.form.contains(chips),'Native field draft/shell changed');tag.dispose();review.dispose();assert(original.every((n,i)=>root.children[i]===n),'Dispose lost slot order');s.remove();lines.push('PASS '+pack+' '+width+' rows and field');}
for(const pack of ['postvisual','personal']){const host=document.createElement('section');host.dataset.ui=pack;host.style.width='390px';host.innerHTML='<form><div class="ui-field"><input name="tags" value="native draft"></div><div class="ui-tags" data-existing-chips><button type="button" class="ui-tag">Motion</button></div></form>';fixtures.append(host);const form=host.querySelector('form'),input=host.querySelector('input'),shell=input.closest('.ui-field'),chips=host.querySelector('[data-existing-chips]'),originalNext=shell.nextSibling;let commits=0;const tags=SharedUI.createTagInput(input,{field:shell,chips,layout:'field',options:()=>['Motion'],onCommit:()=>commits++});input.focus();input.setSelectionRange(2,5);input.dispatchEvent(new CompositionEvent('compositionstart',{bubbles:true}));input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',isComposing:true,bubbles:true,cancelable:true}));await frame();assert(input===form.elements.tags&&input.parentNode===shell&&chips.parentNode===shell,'Existing field changed native nodes');assert(document.activeElement===input&&input.selectionStart===2&&input.value==='native draft'&&commits===0,'Existing field lost IME/focus/draft');assert(shell.scrollWidth<=shell.clientWidth+1,'Existing field overflows');input.dispatchEvent(new CompositionEvent('compositionend',{bubbles:true}));tags.dispose();assert(shell.nextSibling===originalNext&&chips.parentNode===form&&!shell.hasAttribute('data-ui-tag-field'),'Existing field disposal lost chip placement');host.remove();lines.push('PASS '+pack+' existing field shell, IME and disposal');}
for(let documentIndex=0;documentIndex<2;documentIndex++){const iframe=document.createElement('iframe');fixtures.append(iframe);const d=iframe.contentDocument;d.open();d.write('<link rel="stylesheet" href="/v1/styles.css"><script src="/v1/runtime.js"><'+'/script><form id="filters"><details><summary>Filters</summary><div id="fallback"></div></details><label id="field" class="ui-field"><input name="q" value="preserved" data-ui-filter-field></label></form><div id="primary" style="width:300px"></div><button id="trigger">Choices</button><section id="tray" class="ui-popout" popover><input aria-label="Find choice"><button>Choose</button></section>');d.close();await new Promise(resolve=>iframe.onload=resolve);const UI=iframe.contentWindow.SharedUI,field=d.querySelector('#field'),input=field.querySelector('input'),form=d.querySelector('form'),primary=d.querySelector('#primary'),fallback=d.querySelector('#fallback'),slot=UI.createResponsiveSlot(field,{primary,fallback});assert(input.form===form&&form.elements.q===input,'Header search lost form association');input.focus();input.setSelectionRange(2,4);primary.style.width='100px';slot.refresh();assert(field.parentNode===fallback&&d.querySelector('details').open,'Focused fallback did not open filters');assert(d.activeElement===input&&input.selectionStart===2,'Relocation lost focus/caret');input.dispatchEvent(new iframe.contentWindow.CompositionEvent('compositionstart',{bubbles:true}));primary.style.width='300px';slot.refresh();assert(field.parentNode===fallback,'IME moved during composition');input.dispatchEvent(new iframe.contentWindow.CompositionEvent('compositionend',{bubbles:true}));assert(field.parentNode===primary,'IME completion did not relocate');slot.dispose();assert(field.parentNode===form&&!input.hasAttribute('form'),'Slot disposal did not restore form');const trigger=d.querySelector('#trigger'),tray=d.querySelector('#tray'),popover=UI.createAnchoredPopover(trigger,{element:tray});popover.open();await frame();assert(tray.matches(':popover-open')&&trigger.getAttribute('aria-expanded')==='true','Popover failed to open');tray.querySelector('input').focus();tray.dispatchEvent(new iframe.contentWindow.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(!tray.matches(':popover-open')&&d.activeElement===trigger,'Escape did not close and return focus');const match=iframe.contentWindow.matchMedia;iframe.contentWindow.matchMedia=()=>({matches:true});assert(UI.animatePanel(tray)===undefined,'Reduce Motion animated');iframe.contentWindow.matchMedia=match;popover.dispose();iframe.remove();lines.push('PASS document '+documentIndex+' form, IME, popover, keyboard and reduced motion');}output.textContent=lines.join('\n')+'\nALL COMPACT NATIVE CHECKS PASSED';}catch(error){output.textContent='FAILED '+error.stack;}};
</script></html>
