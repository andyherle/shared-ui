<!doctype html><html lang="en" data-ui="postvisual" data-ui-density="compact"><meta charset="utf-8"><title>Shared review reflow contract</title><link rel="stylesheet" href="/v1/styles.css"><script src="/v1/runtime.js"></script><style>@layer app{main{padding:0}.sample{margin-block:16px;min-inline-size:0}.panel-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--ui-aside)}.panel-grid[data-ui-resize-layout=stack]{grid-template-columns:minmax(0,1fr)}.panel-grid>aside{position:relative;--ui-popout-width:100%}pre{white-space:pre-wrap}}</style><main><button id="run">Run review checks</button><pre id="result" role="status">Both packs, themes, wrap tags, resize and native drafts.</pre><div id="fixtures"></div></main><script>
const UI=SharedUI,result=document.querySelector('#result'),fixtures=document.querySelector('#fixtures'),cleanup=[];
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))),assert=(v,m)=>{if(!v)throw Error(m)};
const longTag=i=>i%2?'VeryLongUnbrokenTag'+('XYZ'.repeat(45))+i:'長いタグと保存済みのメモ 🪐 '+i+' — a readable selected tag';
function sample(pack,theme){
 const container=document.createElement('section');container.className='sample ui-safe';container.dataset.ui=pack;container.dataset.theme=theme;container.dataset.uiDensity='compact';container.innerHTML=`<h2>${pack} ${theme}</h2><div data-review-root><div data-ui-review-slot="rating" role="group" aria-label="Rating">${[1,2,3,4,5].map(i=>`<button data-ui-icon="star" data-ui-label="hidden" aria-label="Rate ${i} of 5">Rate ${i}</button>`).join('')}</div><div data-ui-review-slot="actions" role="group" aria-label="Media actions"><button data-ui-icon="check">Select</button><button data-ui-icon="close">Reject</button><button data-ui-icon="grid">Add to board</button><button data-ui-icon="copy">Copy image</button><button data-ui-icon="download">Download</button></div><div class="ui-tags" data-ui-review-slot="tags"><form class="ui-field"><input aria-label="Add tag" placeholder="Type a tag…" autocomplete="off"></form><div class="ui-tags" aria-label="Tags"></div></div><nav class="ui-actions" aria-label="Navigation"><button data-ui-icon="arrow-left">Previous</button><button data-ui-icon="arrow-right">Next</button></nav></div><div class="panel-grid ui-safe"><div class="ui-pad">Media stage retains its minimum width.</div><aside class="ui-popout"><header>Inspector</header><div data-ui-popout-body><label class="ui-field"><input aria-label="Inspector draft" value="Keep this draft"></label></div></aside></div>`;fixtures.append(container);
 const root=container.querySelector('[data-review-root]'),review=UI.createReviewControls(root,{navigation:root.querySelector('nav'),layout:'bar',iconOnly:true,sprite:'/v1/icons.svg'}),input=root.querySelector('input'),chips=root.querySelector('[aria-label=Tags]');
 const tags=UI.createTagInput(input,{field:review.slots.tags,chips,layout:'wrap',options:()=>['Motion','Mood'],onCommit(){throw Error('Resize committed a draft');}});
 for(let i=0;i<18;i++){const chip=document.createElement('button');chip.className='ui-tag';UI.adoptAction(chip,{label:longTag(i),ariaLabel:'Remove '+longTag(i)});chips.append(chip);}
 const grid=container.querySelector('.panel-grid'),panel=grid.querySelector('aside'),resize=UI.createResizablePanel(panel,{container:grid,value:352,min:240,minMain:280});
 cleanup.push(()=>{tags.dispose();review.dispose();resize.dispose();});return{container,root,review,input,chips,tags,grid,panel,resize};
}
window.runReviewChecks=async()=>{cleanup.splice(0).forEach(fn=>fn());fixtures.replaceChildren();result.textContent='RUNNING';try{const lines=[];for(const pack of ['postvisual','personal'])for(const theme of ['light','dark']){const s=sample(pack,theme),input=s.input;
 const boundary=document.createElement('section');boundary.className='ui-safe';boundary.style.setProperty('--ui-safe-inset','30px');boundary.innerHTML='<div class="ui-pad"><div class="ui-pad">Ordinary nested card</div></div><footer class="ui-review-dock" data-ui-position="flow">Safe review boundary</footer>';s.container.append(boundary);await frame();
 assert(parseFloat(getComputedStyle(boundary).paddingLeft)===30,'Explicit safe boundary ignored inset');assert(parseFloat(getComputedStyle(boundary.querySelector('.ui-review-dock')).paddingLeft)===30,'Review dock ignored inherited safe inset');for(const card of boundary.querySelectorAll('.ui-pad'))assert(parseFloat(getComputedStyle(card).paddingLeft)===2*parseFloat(getComputedStyle(card).getPropertyValue('--ui-gap')),'Safe inset changed ordinary/nested card spacing');boundary.remove();
 s.input.value='Uncommitted draft 入力';input.focus();const original=input;let wide;
 for(const width of [1440,800,390,800,1440]){
 s.container.style.width=width+'px';s.review.refresh();s.resize.refresh();await frame();s.resize.refresh();await frame();
 const root=s.root.getBoundingClientRect(),entry=input.getBoundingClientRect(),list=s.chips.getBoundingClientRect();
 assert(input===original&&input.value==='Uncommitted draft 入力','Resize lost native draft');assert(entry.width>=Math.min(200,root.width-2),'Tag entry became unreadable');assert(entry.bottom<=list.top+1,'Chip list overlaps entry');assert(s.chips.scrollWidth<=s.chips.clientWidth+1,'Tag list needs horizontal scrolling');assert(s.chips.scrollHeight>s.chips.clientHeight,'Many long tags must remain in bounded vertical scroll');
 assert(list.height<=parseFloat(getComputedStyle(s.chips).maxBlockSize)+1,'Tag list exceeded semantic height cap');assert(root.width<=1024+1,'Review bar exceeded default dock cap');
 const chipRects=[...s.chips.children].map(n=>n.getBoundingClientRect());for(let i=0;i<chipRects.length;i++){const r=chipRects[i];assert(r.left>=list.left-1&&r.right<=list.right+1,'Long chip escaped its list');for(let j=i+1;j<chipRects.length;j++){const q=chipRects[j];assert(r.right<=q.left+1||q.right<=r.left+1||r.bottom<=q.top+1||q.bottom<=r.top+1,'Chips overlap');}}
 for(const slot of [s.review.slots.rating,s.review.slots.actions,s.review.slots.navigation]){const r=slot.getBoundingClientRect();assert(r.left>=root.left-1&&r.right<=root.right+1,'Commands escaped bounded bar');assert(slot.scrollWidth<=slot.clientWidth+1,'Command row scrolls horizontally');}
 const layout=s.grid.getAttribute('data-ui-resize-layout');assert(layout===(width===390?'stack':'side'),'Panel layout did not follow content width');if(layout==='side'){const panel=s.panel.getBoundingClientRect(),handle=s.resize.element.getBoundingClientRect();assert(Math.abs(handle.left+6-panel.left)<=1,'Resize separator missed safe padded panel edge');if(width===1440){if(wide!==undefined)assert(s.resize.value===wide,'Resize lost preferred panel width');wide=s.resize.value;}}
 s.chips.lastElementChild.focus();await frame();const focused=s.chips.lastElementChild.getBoundingClientRect(),bounds=s.chips.getBoundingClientRect();assert(focused.bottom<=bounds.bottom+1&&focused.top>=bounds.top-1,'Keyboard cannot reach last tag');input.focus({preventScroll:true});s.tags.hide();lines.push('PASS '+pack+' '+theme+' '+width+'px');
 }
 // Legacy horizontal choices still bound long strings without changing native input identity.
 for(const layout of ['inline','stacked']){const field=document.createElement('div');field.className='ui-tags';field.style.width='280px';field.innerHTML='<label class="ui-field"><input value="Keep literal"></label><div class="ui-tags"></div>';s.container.append(field);const entry=field.querySelector('input'),chips=field.lastElementChild,control=UI.createTagInput(entry,{field,chips,layout});for(let i=0;i<4;i++){const chip=document.createElement('button');chip.className='ui-tag';UI.adoptAction(chip,{label:longTag(i)});chips.append(chip);}await frame();assert(chips.getBoundingClientRect().right<=field.getBoundingClientRect().right+1,'Legacy chips escaped field');assert(entry.value==='Keep literal','Legacy input changed');control.dispose();field.remove();}
 }
 result.textContent=lines.join('\n')+'\nALL REVIEW CHECKS PASSED';return lines.length;}catch(error){result.textContent='FAILED '+error.stack;throw error;}};
document.querySelector('#run').onclick=()=>runReviewChecks().catch(()=>{});window.addEventListener('pagehide',()=>cleanup.splice(0).forEach(fn=>fn()),{once:true});
</script></html>
