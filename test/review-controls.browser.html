<!doctype html><html lang="en" data-ui="postvisual" data-ui-density="compact"><meta charset="utf-8"><title>Shared grouped review controls</title><link rel="stylesheet" href="/v1/styles.css"><script src="/v1/runtime.js"></script><style>@layer app{main{padding:16px}.sample{margin-block:16px;max-width:none}pre{white-space:pre-wrap}}</style><main><h1>Grouped review controls</h1><button id="run">Run review checks</button><pre id="result" role="status">Ratings, compact commands, dynamic Trash and stable tags in both packs.</pre><div id="fixtures"></div></main><script>
const UI=SharedUI,result=document.querySelector('#result'),fixtures=document.querySelector('#fixtures'),cleanup=[];
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))),assert=(v,m)=>{if(!v)throw Error(m)};
function sample(pack){
 const container=document.createElement('section');container.className='sample';container.dataset.ui=pack;container.dataset.uiDensity='compact';container.innerHTML=`<h2>${pack}</h2><div data-review-root><div data-ui-review-slot="rating" role="group" aria-label="Rating">${[1,2,3,4,5].map(i=>`<button data-ui-icon="star" data-ui-label="hidden" aria-label="Rate ${i} of 5">Rate ${i}</button>`).join('')}</div><div data-ui-review-slot="actions" role="group" aria-label="Media actions"><div class="ui-actions ui-inline"><button data-ui-icon="check">Select</button><button data-ui-icon="close">Reject</button></div><button data-ui-icon="grid">Add to board</button><button data-ui-icon="copy">Copy image</button><button data-ui-icon="download">Download</button></div><div class="ui-tags" data-ui-review-slot="tags"><form class="ui-field"><input aria-label="Add tag" placeholder="Type a tag…" autocomplete="off"></form><div class="ui-tags" aria-label="Tags"></div></div></div>`;fixtures.append(container);
 const root=container.querySelector('[data-review-root]'),review=UI.createReviewControls(root,{iconOnly:true,sprite:'/v1/icons.svg'}),input=root.querySelector('input'),chips=root.querySelector('[aria-label=Tags]');
 const tags=UI.createTagInput(input,{field:review.slots.tags,chips,layout:'stacked',options:()=>['Motion','Mood'],onCommit:text=>{const b=document.createElement('button');b.className='ui-tag';b.textContent=text;chips.append(b);}});
 const trash=document.createElement('button');trash.dataset.uiIcon='trash';trash.dataset.uiLabel='always';trash.textContent='Move to Trash';review.addAction(trash);
 cleanup.push(()=>{tags.dispose();review.dispose();});return{container,root,review,input,chips,tags,trash};
}
document.querySelector('#run').onclick=async()=>{cleanup.splice(0).forEach(fn=>fn());fixtures.replaceChildren();result.textContent='RUNNING';try{const lines=[];for(const pack of ['postvisual','personal']){const s=sample(pack);for(const width of [280,320,560,1000,320]){
 s.container.style.width=width+'px';s.review.refresh();await frame();
 const rating=s.review.slots.rating.getBoundingClientRect(),actions=s.review.slots.actions.getBoundingClientRect(),entry=s.input.getBoundingClientRect(),root=s.root.getBoundingClientRect();
 assert(Math.abs((rating.left+rating.right-root.left-root.right)/2)<1,pack+' rating must be centered');assert(Math.abs((actions.left+actions.right-root.left-root.right)/2)<1,pack+' actions must be centered');assert(rating.bottom<=actions.top&&actions.bottom<=entry.top,'Slots overlap');
 const rowButtons=[...s.review.slots.actions.querySelectorAll('button')];for(const b of rowButtons){assert(b.dataset.uiLabel==='hidden',b.textContent+' must use icon-only mode');assert(Math.abs(b.getBoundingClientRect().top-actions.top)<1,'Command wrapped into a new line');assert(getComputedStyle(b.querySelector('.ui-label')).display==='none','Command caption remains visible');assert(b.getAttribute('aria-label'),'Missing accessible command name');}
 const before={root:s.root.getBoundingClientRect().height,entry:entry.width,rating:rating.top,actions:actions.top};
 for(let i=0;i<20;i++){const chip=document.createElement('button');chip.className='ui-tag';chip.textContent='Long selected tag '+i;s.chips.append(chip);}s.input.focus();s.input.value='Mo';s.input.dispatchEvent(new Event('input',{bubbles:true}));await frame();
 assert(Math.abs(s.root.getBoundingClientRect().height-before.root)<1,'Tags/suggestions changed menu height');assert(Math.abs(s.input.getBoundingClientRect().width-before.entry)<1,'Tags shrank the entry');assert(Math.abs(s.review.slots.rating.getBoundingClientRect().top-before.rating)<1&&Math.abs(s.review.slots.actions.getBoundingClientRect().top-before.actions)<1,'Tags moved command rows');
 assert(s.chips.scrollWidth>s.chips.clientWidth,'Long tags need horizontal scrolling');s.tags.hide();s.input.blur();s.input.value='';s.chips.replaceChildren();lines.push('PASS '+pack+' '+width+'px: centered rating, one icon row including Trash, stable entry/chip rows and suggestions');
 }s.container.style.width='min(100%,1000px)';}result.textContent=lines.join('\n')+'\nALL REVIEW CHECKS PASSED';}catch(error){result.textContent='FAILED '+error.stack;}};
window.addEventListener('pagehide',()=>cleanup.splice(0).forEach(fn=>fn()),{once:true});
</script></html>
