<!doctype html><html lang="en" data-ui="postvisual" data-ui-density="compact"><meta charset="utf-8"><title>Shared context toolbar regression</title><link rel="stylesheet" href="/v1/styles.css"><script src="/v1/runtime.js"></script><style>@layer app {main{padding:16px}.sample{position:relative;height:180px;width:320px;border:1px solid var(--ui-line);margin-block:12px}pre{white-space:pre-wrap}}</style><main><h1>Context toolbar contract</h1><button id="run">Run toolbar checks</button><pre id="result" role="status">Both packs; 320, 560 and 1000 px containers; nested commands; native focus.</pre><div id="fixtures"></div></main><script>
const UI=SharedUI,result=document.querySelector('#result'),fixtures=document.querySelector('#fixtures');
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const assert=(value,message)=>{if(!value)throw Error(message)};
function sample(pack){
 const section=document.createElement('section');section.dataset.ui=pack;section.dataset.uiDensity='compact';section.innerHTML=`<h2>${pack}</h2><div class="sample"><nav aria-label="${pack} context commands"><div class="ui-actions ui-inline"><button>Text</button><button>Images</button><button>StaticRef</button><button>Column</button></div></nav><div class="ui-toolbar ui-actions ui-inline" aria-label="${pack} zoom"><button>Zoom out</button><button>100%</button><button>Zoom in</button></div></div>`;fixtures.append(section);
 const container=section.querySelector('.sample'),toolbar=section.querySelector('nav'),zoom=container.lastElementChild;
 [...toolbar.querySelectorAll('button')].forEach((button,i)=>UI.adoptAction(button,{icon:['edit','image','search','columns'][i],sprite:'/v1/icons.svg'}));
 [...zoom.children].forEach((button,i)=>UI.adoptAction(button,{...(i===1?{}:{icon:i===0?'minus':'plus'}),iconOnly:i!==1,sprite:'/v1/icons.svg'}));zoom.children[1].dataset.uiLabel='always';
 UI.observeActions(toolbar.querySelector('.ui-actions'));
 toolbar.style.position='fixed';toolbar.style.bottom='0';
 const dock=UI.createContextToolbar(toolbar,{container,zoom});return{container,toolbar,zoom,dock,section};
}
document.querySelector('#run').onclick=async()=>{
 result.textContent='RUNNING';document.querySelector('#run').disabled=true;fixtures.replaceChildren();
 try{const lines=[];
 const shell=document.createElement('aside');shell.hidden=true;shell.innerHTML='<details class="ui-disclosure ui-overflow" data-ui-overflow="expanded" open><summary>More</summary><button>Secondary</button></details>';fixtures.append(shell);
 const feedback=UI.createZoomFeedback(document,{sprite:'/v1/icons.svg'});feedback.setVisible(true);assert(!feedback.element.hidden,'Hidden expanded More must not hide zoom');
 shell.hidden=false;feedback.setVisible(true);assert(!feedback.element.hidden,'Visible inline expanded More must not hide zoom');
 shell.firstElementChild.dataset.uiOverflow='collapsed';feedback.setVisible(true);assert(feedback.element.hidden,'Visible open menu must hide zoom');
 shell.remove();feedback.setVisible(true);assert(!feedback.element.hidden,'Zoom must return after the overlay closes');feedback.dispose();lines.push('PASS zoom visibility: hidden/inline More ignored; visible open menu hides zoom and closing restores it');
 for(const pack of ['postvisual','personal']){const s=sample(pack);for(const width of [320,560,1000,320,1000]){
 s.container.style.width=width+'px';s.dock.refresh();await frame();await frame();
 const t=s.toolbar.getBoundingClientRect(),z=s.zoom.getBoundingClientRect(),c=s.container.getBoundingClientRect();
 assert(getComputedStyle(s.toolbar).position==='static',pack+' adopted toolbar kept old floating positioning');
 assert(t.left>=c.left&&t.right<=c.right,pack+' toolbar outside container at '+width);
 assert(t.right<=z.left||t.bottom<=z.top||z.bottom<=t.top,pack+' toolbar overlaps zoom at '+width);
 assert(Math.abs((t.left+t.right)/2-(c.left+c.right)/2)<1,pack+' toolbar not centered at '+width);
 if(width===320){assert(z.bottom<=t.top,pack+' zoom must stack above commands');assert(Math.abs((z.left+z.right)/2-(c.left+c.right)/2)<1,pack+' stacked zoom must be centered');}
 for(const b of s.toolbar.querySelectorAll('button')){assert(Math.abs(b.getBoundingClientRect().height-30)<=1,pack+' caption wrapped at '+width);assert(b.hasAttribute('data-ui-compact')===(width<1000),pack+' captions failed to compact/restore at '+width);}
 assert(!UI.auditControls(s.container).issues.length,JSON.stringify(UI.auditControls(s.container).issues));
 s.toolbar.querySelector('button').focus();assert(getComputedStyle(s.toolbar).opacity==='1','Keyboard focus must restore full opacity');s.toolbar.querySelector('button').blur();
 lines.push('PASS '+pack+' '+width+'px: bounded, centered, no overlap or wrapped captions, shared action audit, keyboard visibility');
 }s.container.style.width='min(100%,1000px)';s.dock.refresh();}
 const raw=document.createElement('button');raw.innerHTML='<svg class="ui-icon"></svg><span class="ui-label">Unregistered</span>';const group=document.createElement('div');group.className='ui-actions';group.append(raw);fixtures.append(group);await frame();assert(UI.auditControls(group).issues.some(i=>i.code==='unadopted-action'),'Audit missed unregistered native icon button');group.remove();
 const controls=document.createElement('section');fixtures.append(controls);const selected=[];const palette=UI.createColorPanel({multiple:true,onChange:values=>selected.push(values)});controls.append(palette.element);palette.buttons[0].click();palette.buttons[1].click();assert(selected.at(-1).length===2,'Swatches must allow multiple selections');palette.buttons[0].click();assert(selected.at(-1).length===1,'Selecting the same swatch must remove it');
 const trigger=document.createElement('button');trigger.textContent='Colour';controls.append(trigger);const picker=UI.createColorPicker(trigger);picker.open();await frame();assert(picker.element.getBoundingClientRect().height<400,'Colour picker stretched beyond content');picker.open();assert(!picker.element.matches(':popover-open'),'Second colour command must close its panel');picker.dispose();palette.dispose();controls.remove();lines.push('PASS shared swatches: add/remove nodes and content-sized toggleable colour panel');
 result.textContent=lines.join('\n')+'\nPASS negative fixture: unregistered native icon action rejected\nALL TOOLBAR CHECKS PASSED';
 }catch(error){result.textContent='FAILED '+error.stack;}finally{document.querySelector('#run').disabled=false;}
};
</script></html>
