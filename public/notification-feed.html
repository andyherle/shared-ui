<!doctype html>
<html lang="en" data-ui="portal" data-ui-density="compact"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notification feed · Shared UI</title><link rel="stylesheet" href="v1/styles.css"><link rel="stylesheet" href="v1/notification-feed.css"><style>@layer app{main{max-width:42rem;margin:24px auto;padding:16px}.demo-compose{margin-block:24px}.demo-compose textarea{width:100%}}</style></head><body><main class="ui-stack"><h1>Notification feed</h1><p class="ui-meta">Synthetic component catalogue. Same native controls; a distinct Portal profile. Swipe right to open a reply, or left to activate dismissal.</p><div class="ui-actions"><button type="button" class="ui-action" data-theme-toggle><svg class="ui-icon" aria-hidden="true"><use href="v1/icons.svg#ui-appearance"/></svg><span class="ui-label">Light / dark</span></button></div><section class="ui-compose demo-compose"><label for="capture">Capture</label><textarea id="capture" class="ui-inline-field" rows="2" placeholder="A thought or an update…"></textarea></section><div class="ui-feed" id="feed"><article class="ui-notification" data-ui-swipe data-ui-swipe-right="Reply" data-ui-swipe-left="Dismiss"><div class="ui-notification-body"><span class="ui-notification-mark" aria-hidden="true"><svg class="ui-icon"><use href="v1/icons.svg#ui-message"/></svg></span><div class="ui-notification-content"><p class="ui-notification-meta">Question</p><details><summary data-ui-swipe-start>What would make the outline useful?</summary><p class="ui-meta">Swipe this collapsed native summary, or use Reply and Dismiss below.</p></details><div class="ui-actions ui-notification-actions"><details class="ui-disclosure" data-reply><summary class="ui-action" data-ui-label="always" data-ui-variant="quiet"><svg class="ui-icon" aria-hidden="true"><use href="v1/icons.svg#ui-message"/></svg><span class="ui-label">Reply</span></summary><div class="ui-disclosure-body"><label for="reply" class="ui-sr-only">Your reply</label><textarea id="reply" rows="2"></textarea></div></details><button type="button" data-dismiss data-ui-trailing class="ui-action" data-ui-variant="quiet" data-ui-label="always"><svg class="ui-icon" aria-hidden="true"><use href="v1/icons.svg#ui-close"/></svg><span class="ui-label">Dismiss</span></button></div><p role="status" class="ui-status" data-demo-status></p></div></div></article></div><script type="module">
import {mountSwipeActions} from './v1/swipe-actions.mjs';
const feed=document.getElementById('feed');let release=mountSwipeActions(feed);
feed.addEventListener('ui:swipe',event=>{const row=event.target;if(event.detail.direction==='right'){row.querySelector('[data-reply]').open=true;row.querySelector('textarea').focus();}else row.querySelector('[data-dismiss]').click();});
feed.querySelector('[data-dismiss]').addEventListener('click',()=>{feed.querySelector('[data-demo-status]').textContent='Dismiss requested. This catalogue does not save application data.';});
document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';});
addEventListener('pagehide',()=>{release?.();release=null;});addEventListener('pageshow',()=>{if(!release)release=mountSwipeActions(feed);});
</script></main></body></html>
