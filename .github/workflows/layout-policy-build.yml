name: Assemble and validate layout policy
on:
  push:
    branches: [feat/shared-layout-policy-20261030]
    paths:
      - .github/layout-build/**
      - .github/workflows/layout-policy-build.yml
permissions:
  contents: read
concurrency:
  group: shared-ui-layout-policy-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'andyherle/shared-ui' && github.ref == 'refs/heads/feat/shared-layout-policy-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          chunks = [pathlib.Path(f'.github/layout-build/part-{i}.b64').read_text().strip() for i in range(4)]
          patch = zlib.decompress(base64.b64decode(''.join(chunks), validate=True))
          expected = '7b7f26ce7c37067b03265cb1b1b1dbc2d8f494535a226fa74a32360fcc609dab'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch integrity mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'layout.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/layout.patch"
          git apply "$RUNNER_TEMP/layout.patch"
          # Workflow changes are applied separately through the connector after validation.
          git checkout -- .github/workflows/pull-request.yml
          npm install --prefix tools/browser --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/layout-build
          git add README.md docs package.json scripts src test tools/browser/package.json tools/browser/package-lock.json
          git commit -m 'feat: shared native control groups with scoped layout inheritance'
      - name: Run source and build checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee validation.log
          npm ci --prefix tools/studio-mcp --ignore-scripts
          npm run studio:mcp:check 2>&1 | tee mcp-validation.log
      - name: Install isolated browser test engines
        run: ./tools/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test Chromium
        shell: bash
        run: |
          set -o pipefail
          npm run composition:browser 2>&1 | tee chromium-validation.log
      - name: Test WebKit
        shell: bash
        run: |
          set -o pipefail
          UI_TEST_BROWSER=webkit npm run composition:browser 2>&1 | tee webkit-validation.log
      - name: Commit generated output and update only this branch
        shell: bash
        run: |
          git add public
          if ! git diff --cached --quiet; then git commit -m 'build: generate validated native composition assets'; fi
          remote_sha="$(git ls-remote origin refs/heads/feat/shared-layout-policy-20261030 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'Branch changed; refusing to overwrite concurrent work'; exit 1; }
          git push origin HEAD:refs/heads/feat/shared-layout-policy-20261030
      - name: Package exact validation source
        if: always()
        run: |
          git rev-parse HEAD > validation-source-sha.txt
          git archive --format=zip --output=validation-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-policy-validation-${{ github.run_id }}
          path: |
            *validation.log
            validation-source-sha.txt
            validation-source.zip
            test-results/
          retention-days: 7
          if-no-files-found: error
